name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler ceux en attente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Préparation de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déploiement (tentative 1)
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause avant nouvelle tentative
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Déploiement (tentative 2)
        id: retry1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause avant dernière tentative
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60

      - name: Déploiement (tentative 3)
        id: retry2
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
