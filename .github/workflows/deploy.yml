name: Déploiement du site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler ceux en attente
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configuration Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # Seuls les fichiers du site partent en ligne : les notes internes (*.md),
      # les scripts de l'orga (outils/) et la configuration GitHub restent dans le dépôt
      - name: Sélection des fichiers publics
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '/outils/' \
            --exclude '*.md' --exclude '.gitignore' --exclude '.DS_Store' ./ _site/

      - name: Préparation de l'artefact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

      - name: Déploiement (tentative 1)
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Pause avant nouvelle tentative
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Déploiement (tentative 2)
        id: retry1
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Pause avant dernière tentative
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60

      - name: Déploiement (tentative 3)
        id: retry2
        if: steps.deploy.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
